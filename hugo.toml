# For deployment, override via: hugo --baseURL "https://yourdomain.com/"
baseURL = "/"
locale = "en-us"
title = "RaihnForge"

[params]
  author = "Joshua Keyes"
  description = "Product-minded creator building from vision to release — digital design, game development, and human-centric product thinking."
  subtitle = "Raise your hammer to the storm!"
  role = "Product Owner & Creative Producer"
  email = "Joshua.Keyes@gmail.com"

  [params.social]
    instagram = "https://instagram.com/raihnforge"
    youtube = "https://youtube.com/@raihnforge"
    facebook = "https://facebook.com/raihnforge"
    twitter = "https://twitter.com/RaihnForge"

[taxonomies]
  tag = "tags"
  medium = "medium"
  art_type = "art_type"   # Gallery type pages; ids + titles live in data/art_taxonomy.json

[permalinks]
  [permalinks.taxonomy]
    art_type = "/art/type/"
  [permalinks.term]
    art_type = "/art/type/:slug/"

[menu]
  [[menu.main]]
    name = "Gallery"
    url = "/art/"
    weight = 1
  [[menu.main]]
    name = "Products"
    url = "/gamedev/"
    weight = 2
  [[menu.main]]
    name = "Journal"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Scholar"
    url = "/scholar/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5
